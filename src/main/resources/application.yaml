server:
  port: ${PORT:8080}

spring:
  application:
    name: cuentas-claras

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:cuentasclaras}?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

openai:
  api:
    key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:gpt-4o-mini}

logging:
  level:
    org.hibernate.SQL: DEBUG