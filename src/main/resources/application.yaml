server:
  port: ${PORT:8080}

spring:
  application:
    name: cuentas-claras

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:cuentasclaras}?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    # En producción debe quedar en false para no volcar SQL (con datos) en los logs
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: ${JPA_SHOW_SQL:false}

gemini:
  api:
    key: ${GEMINI_API_KEY:sin-key}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

app:
  security:
    jwt:
      # Secreto HMAC de mínimo 32 caracteres. Si no se define, se genera uno
      # aleatorio al arrancar (los tokens dejan de ser válidos en cada reinicio).
      secret: ${JWT_SECRET:}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    # Rol asignado a todo usuario que se registra por el endpoint público.
    default-role-code: ${DEFAULT_ROLE_CODE:USR}
    # Rol con privilegios de administración (gestión de usuarios, roles y permisos).
    admin-role-code: ${ADMIN_ROLE_CODE:ADM}
    # Clave AES-256 (32 bytes en Base64) para cifrar columnas financieras sensibles.
    # CRÍTICA: si se pierde o cambia, los datos cifrados quedan ilegibles. Sin valor
    # se usa una clave de desarrollo insegura (solo para local).
    data-encryption-key: ${DATA_ENCRYPTION_KEY:}
    google:
      # OAuth Client ID creado en Google Cloud Console. El backend valida que el "aud"
      # del ID token coincida con este valor. Es un identificador público (no secreto),
      # pero el login/registro con Google se rechaza si no está configurado.
      client-id: ${GOOGLE_CLIENT_ID:}
    rate-limit:
      login:
        max-requests: ${RATE_LIMIT_LOGIN_MAX:5}
        window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:60}
      google:
        max-requests: ${RATE_LIMIT_GOOGLE_MAX:10}
        window-seconds: ${RATE_LIMIT_GOOGLE_WINDOW:60}
      ai-coach:
        max-requests: ${RATE_LIMIT_AI_MAX:15}
        window-seconds: ${RATE_LIMIT_AI_WINDOW:3600}
    login:
      # Bloqueo temporal de la cuenta tras N contraseñas incorrectas consecutivas
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:10}
      lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}

# Documentación del API. Poner SWAGGER_ENABLED=false en producción.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    # DEBUG vuelca cada consulta SQL; en producción dejar en WARN
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:WARN}