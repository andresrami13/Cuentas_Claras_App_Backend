server:
  port: ${PORT:8080}

spring:
  application:
    name: cuentas-claras

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:cuentasclaras}?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

gemini:
  api:
    key: ${GEMINI_API_KEY:sin-key}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

app:
  security:
    jwt:
      # Secreto HMAC de mínimo 32 caracteres. Si no se define, se genera uno
      # aleatorio al arrancar (los tokens dejan de ser válidos en cada reinicio).
      secret: ${JWT_SECRET:}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    # Rol asignado a todo usuario que se registra por el endpoint público.
    default-role-code: ${DEFAULT_ROLE_CODE:USR}
    # Rol con privilegios de administración (gestión de usuarios, roles y permisos).
    admin-role-code: ${ADMIN_ROLE_CODE:ADM}
    rate-limit:
      login:
        max-requests: ${RATE_LIMIT_LOGIN_MAX:5}
        window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:60}
      ai-coach:
        max-requests: ${RATE_LIMIT_AI_MAX:15}
        window-seconds: ${RATE_LIMIT_AI_WINDOW:3600}

# Documentación del API. Poner SWAGGER_ENABLED=false en producción.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    org.hibernate.SQL: DEBUG